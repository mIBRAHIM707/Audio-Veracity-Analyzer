; AVA lab PJSIP (backlog 6.1; PRD FR-T1). Local container only: SIPp and Asterisk
; talk over the container loopback; nothing is reachable from outside.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Unauthenticated calls from the lab call generator. The codec is forced by the
; caller's single-codec SDP offer (G.711 mu-law, A-law or GSM 06.10).
[anonymous]
type=endpoint
context=from-sipp
disallow=all
allow=ulaw,alaw,gsm
direct_media=no
rtp_symmetric=yes

; Agent endpoint for extension 701: a SIPp UAS the test starts on 127.0.0.1:5070.
[agent]
type=aor
contact=sip:agent@127.0.0.1:5070

[agent]
type=endpoint
context=from-sipp
disallow=all
allow=ulaw
aors=agent
direct_media=no

; Second SIP endpoints for bridged calls (extensions 810/811; PRD FR-T1 "two or more SIP
; endpoints ... codec forcing for G.711 and GSM"). The PBX forces each agent's codec:
; whatever the caller offers, agent_alaw is offered A-law only and agent_gsm GSM 06.10
; only, so Asterisk transcodes between the two legs. Each is a SIPp UAS the test starts.
[agent_alaw]
type=aor
contact=sip:agent@127.0.0.1:5071

[agent_alaw]
type=endpoint
context=from-sipp
disallow=all
allow=alaw
aors=agent_alaw
direct_media=no

[agent_gsm]
type=aor
contact=sip:agent@127.0.0.1:5072

[agent_gsm]
type=endpoint
context=from-sipp
disallow=all
allow=gsm
aors=agent_gsm
direct_media=no
