; AVA lab PJSIP (backlog 6.1; PRD FR-T1). Local container only: SIPp and Asterisk
; talk over the container loopback; nothing is reachable from outside.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Unauthenticated calls from the lab call generator. The codec is forced by the
; caller's single-codec SDP offer (G.711 mu-law, A-law or GSM 06.10).
[anonymous]
type=endpoint
context=from-sipp
disallow=all
allow=ulaw,alaw,gsm
direct_media=no
rtp_symmetric=yes
