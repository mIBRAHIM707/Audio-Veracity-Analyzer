; AVA lab dialplan (backlog 6.1; PRD FR-T1). Extension 600 answers and records what
; the caller sends (receive direction only) to /lab/io/rec-<caller number>.wav
; (8 kHz signed linear), so a test can compare injected and received audio.
[general]
static=yes
writeprotect=yes

[from-sipp]
exten => 600,1,NoOp(AVA lab inject from ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(LABFILE=rec-${FILTER(a-zA-Z0-9_,${CALLERID(num)})})
 same => n,ExecIf($["${LABFILE}" = "rec-"]?Set(LABFILE=rec-${UNIQUEID}))
 same => n,Record(/lab/io/${LABFILE}.wav,0,60,qkx)
 same => n,Hangup()

; Extension 700: the same call, tapped by AVA (services/tap, backlog 6.2). The call
; never enters Stasis: the tap watches channel events and attaches a snoop channel once
; the call is answered and marked, so a dead or slow tap cannot hold the call (PRD
; FR-T4). AVA_TAP=caller marks the inbound caller leg; it is a plain variable, so legs
; created by Dial() do not inherit it and are never tapped as the caller.
exten => 700,1,NoOp(AVA lab tapped call from ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(AVA_TAP=caller)
 same => n,Set(LABFILE=rec-${FILTER(a-zA-Z0-9_,${CALLERID(num)})})
 same => n,ExecIf($["${LABFILE}" = "rec-"]?Set(LABFILE=rec-${UNIQUEID}))
 same => n,Record(/lab/io/${LABFILE}.wav,0,60,qkx)
 same => n,Hangup()

; Extension 701: a marked caller connected to an agent endpoint (a SIPp UAS the test
; starts on 127.0.0.1:5070), so a test can check that only the caller leg is tapped.
exten => 701,1,NoOp(AVA lab caller to agent from ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(AVA_TAP=caller)
 same => n,Dial(PJSIP/agent,30)
 same => n,Hangup()

; Extensions 810 (A-law agent) and 811 (GSM agent): a bridged call between two SIP
; endpoints with the agent's codec forced by the PBX (pjsip.conf agent_alaw/agent_gsm).
; On the agent leg MixMonitor records what the PBX sent to the agent
; (bridge-<caller>-to-agent.wav) and what came back from it
; (bridge-<caller>-from-agent.wav, the agent echoes RTP), and the leg's negotiated
; native format is written to bridge-<caller>-format.txt once the agent answers. On
; the caller leg MixMonitor records what the PBX sends back to the caller
; (bridge-<caller>-to-caller.wav), and Dial's outcome goes to
; bridge-<caller>-dialstatus.txt. L(60000) caps the call at 60 s like Record does.
exten => _81[01],1,NoOp(AVA lab bridged call from ${CALLERID(num)} to ${EXTEN})
 same => n,Set(LABFILE=bridge-${FILTER(a-zA-Z0-9_,${CALLERID(num)})})
 same => n,ExecIf($["${LABFILE}" = "bridge-"]?Set(LABFILE=bridge-${UNIQUEID}))
 same => n,Set(AGENT=${IF($["${EXTEN}" = "811"]?agent_gsm:agent_alaw)})
 same => n,MixMonitor(/lab/io/${LABFILE}-caller-mix.wav,t(/lab/io/${LABFILE}-to-caller.wav))
 same => n,Dial(PJSIP/${AGENT},30,L(60000)b(lab-agent^record^1(${LABFILE}))U(lab-agent-answered^${LABFILE}))
 same => n,Set(FILE(/lab/io/${LABFILE}-dialstatus.txt)=${DIALSTATUS})
 same => n,Hangup()

; Extension 702: a marked (tapped) caller connected to the registered softphone
; (pjsip.conf, user `softphone`). Recordings use the 81x names (bridge-<caller>-*), and
; Dial's outcome goes to bridge-<caller>-dialstatus.txt: CHANUNAVAIL at once when no
; softphone is registered or none is configured.
exten => 702,1,NoOp(AVA lab caller to softphone from ${CALLERID(num)})
 same => n,Set(LABFILE=bridge-${FILTER(a-zA-Z0-9_,${CALLERID(num)})})
 same => n,ExecIf($["${LABFILE}" = "bridge-"]?Set(LABFILE=bridge-${UNIQUEID}))
 same => n,Answer()
 same => n,Set(AVA_TAP=caller)
 same => n,MixMonitor(/lab/io/${LABFILE}-caller-mix.wav,t(/lab/io/${LABFILE}-to-caller.wav))
 same => n,Dial(PJSIP/softphone,30,L(60000)b(lab-agent^record^1(${LABFILE}))U(lab-agent-answered^${LABFILE}))
 same => n,Set(FILE(/lab/io/${LABFILE}-dialstatus.txt)=${DIALSTATUS})
 same => n,Hangup()

; Calls from the authenticated softphone reach the same lab extensions as SIPp callers.
[from-softphone]
include => from-sipp

; b() pre-dial handler on the agent leg (context^exten^priority(args)).
[lab-agent]
exten => record,1,MixMonitor(/lab/io/${ARG1}-mix.wav,r(/lab/io/${ARG1}-from-agent.wav)t(/lab/io/${ARG1}-to-agent.wav))
 same => n,Return()

; U() runs on the agent leg once it answers; it takes a context (from s,1) and ^ args.
[lab-agent-answered]
exten => s,1,Set(FILE(/lab/io/${ARG1}-format.txt)=${CHANNEL(audionativeformat)})
 same => n,Return()
