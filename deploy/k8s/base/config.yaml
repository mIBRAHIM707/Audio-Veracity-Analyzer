# Non-secret settings (PRD FR-O2 ConfigMap). Secrets (ARI and database passwords) are
# in the `ava-secrets` Secret, created by the operator and never committed
# (deploy/k8s/README.md). AVA_ARI_URL must name the site's PBX; 192.0.2.10 is a
# documentation address (RFC 5737) that reaches nothing, so an unedited deployment
# starts but never becomes ready (live's /readyz needs the ARI stream, FR-A8).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ava-config
  labels:
    app.kubernetes.io/part-of: ava
data:
  AVA_ARI_URL: http://192.0.2.10:8088
  AVA_ARI_USER: ava
  AVA_TAP_EXTENSION: "700"
  AVA_ONNX_FILE: model.onnx
  AVA_CARD_FILE: model_card.json
  AVA_THREADS: "4"
  AVA_SCORING_CONFIG_WATCH_S: "10"  # 1-60; live rereads the `ava-scoring` file this often
  # 22 Nov (PRD FR-O5): alert snippets. "off" stores no audio and purges what an earlier
  # "on" left, at the next live start; "on" keeps one AES-256-GCM snippet per alert for
  # AVA_RETENTION_TTL_DAYS (above 0, at most 365). A change needs a live restart
  # (`kubectl -n ava rollout restart deployment/live`) and applies to later calls.
  AVA_RETENTION: "off"
  AVA_RETENTION_TTL_DAYS: "7"
  AVA_API_THREADS: "2"
  # The password is not in the URL: libpq reads PGPASSWORD (from the Secret), so any
  # character works in it (as in the Compose stack).
  AVA_DATABASE_URL: postgresql://ava@postgres:5432/ava
  # 20 Nov (backlog 5.1): the API reads history as this read-only login, created by the
  # API pod's `db-reader-role` init container; its password is `db-reader-password`.
  AVA_HISTORY_DATABASE_URL: postgresql://ava_reader@postgres:5432/ava
  AVA_REDIS_URL: redis://redis:6379/0
