# Pod Security admission "restricted" is enforced: every AVA pod runs as a non-root
# user with no capabilities, no privilege escalation and the runtime's seccomp profile.
apiVersion: v1
kind: Namespace
metadata:
  name: ava
  labels:
    app.kubernetes.io/part-of: ava
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.34
    pod-security.kubernetes.io/warn: restricted
