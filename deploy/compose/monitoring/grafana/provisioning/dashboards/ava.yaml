# Grafana dashboard provider for the AVA lab stack (backlog 7.2; PRD FR-O6). The JSON
# files are mounted read-only; edits in the UI are not saved back.
apiVersion: 1

providers:
  - name: ava
    orgId: 1
    folder: AVA
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
